<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picnic Blanket</title>
<style>
  :root {
    --cream: #FBF7EE;
    --ink: #2E3A44;
    --ink-soft: #667080;
    --card: #FFFFFF;
    --line: #E4ECF0;
    --blue: #3E9FD1;
    --blue-dark: #2C7FAE;
    --green: #4F9A5C;
    --green-dark: #3D7C49;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--blue-dark);
    text-wrap: balance;
  }
  .subtitle {
    margin: 0;
    font-size: 16px;
    color: var(--ink-soft);
  }
  .stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 14px;
    box-shadow: 0 12px 32px rgba(46,58,68,0.10);
  }
  #scene {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    overflow: hidden;
  }
  .food-item { cursor: pointer; transition: transform 0.7s cubic-bezier(.4,1.4,.4,1); }
  .food-item .card { fill: #FFFFFF; stroke: #3A3226; stroke-width: 2.5; }
  .food-item .card-shadow { fill: rgba(0,0,0,0.16); }
  .food-item .photo-outline { stroke: rgba(0,0,0,0.08); stroke-width: 1.5; }
  .food-item .word-text {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    font-size: 25px;
    fill: #2b2b2b;
    letter-spacing: 0.5px;
  }
  .food-item .label { transition: opacity 0.25s ease; opacity: 1; }
  #scene.words-hidden .food-item .label { opacity: 0; }
  #scene.mode-shuffled .food-item .label { opacity: 0; }
  #scene.mode-shuffled .food-item.revealed .label { opacity: 1; }
  #scene.mode-shuffled .food-item .card { stroke: #4F9A5C; stroke-dasharray: 7 6; }
  #scene.mode-shuffled .food-item.revealed .card { stroke: #E8483C; stroke-dasharray: none; }
  .food-item:focus { outline: none; }
  .food-item:focus .card { stroke: #4D96FF; stroke-width: 4; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  button.ctrl {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 10px 18px rgba(0,0,0,0.12);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.ctrl:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.10);
  }
  button.ctrl:focus-visible {
    outline: 3px solid #4D96FF;
    outline-offset: 3px;
  }
  #btnWords { background: var(--blue); }
  #btnWords:hover { background: var(--blue-dark); }
  #btnShuffle { background: var(--green); }
  #btnShuffle:hover { background: var(--green-dark); }
  .ctrl .zh { font-size: 12px; font-weight: 600; opacity: 0.85; letter-spacing: 0.5px; }

  .status {
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);
    min-height: 22px;
  }
  .status b { color: var(--blue-dark); }

  footer {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    opacity: 0.8;
  }

  @media (max-width: 560px) {
    .wrap { padding: 24px 14px 48px; gap: 20px; }
    button.ctrl { padding: 12px 20px; font-size: 15px; }
  }
</style>
</head>

  <footer>Tip: in Shuffle mode, tap any photo to reveal (or hide again) its word.</footer>
</div>

<script>
(function() {
  var scene = document.getElementById('scene');
  var items = Array.prototype.slice.call(document.querySelectorAll('.food-item'));

  var slotPositions = items.map(function(el) {
    var t = el.getAttribute('transform');
    var m = t.match(/translate\(([-\d.]+),\s*([-\d.]+)\)\s*rotate\(([-\d.]+)\)/);
    return { x: parseFloat(m[1]), y: parseFloat(m[2]), rot: parseFloat(m[3]) };
  });
  var defaultOrderIds = items.map(function(el) { return el.getAttribute('data-id'); });
  var idToEl = {};
  items.forEach(function(el) { idToEl[el.getAttribute('data-id')] = el; });

  var mode = 'fixed';
  var wordsVisible = true;

  function placeAtSlots(orderIds) {
    orderIds.forEach(function(id, i) {
      var el = idToEl[id];
      var p = slotPositions[i];
      el.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ') rotate(' + p.rot + ')');
      el.setAttribute('data-slot', i);
    });
  }

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function updateStatus() {
    var statusEl = document.getElementById('status');
    if (mode === 'shuffled') {
      var revealed = items.filter(function(el) { return el.classList.contains('revealed'); }).length;
      statusEl.innerHTML = 'Shuffled! Tap a photo to reveal its word &mdash; <b>' + revealed + ' / ' + items.length + '</b> found';
    } else {
      statusEl.textContent = '';
    }
  }

  function setWordsButtonLabel() {
    var label = document.getElementById('btnWordsLabel');
    var zh = document.getElementById('btnWordsZh');
    if (mode === 'shuffled') {
      label.textContent = 'Show Original';
      zh.textContent = '恢复原图 · 显示单词';
    } else if (wordsVisible) {
      label.textContent = 'Hide Words';
      zh.textContent = '隐藏单词';
    } else {
      label.textContent = 'Show Words';
      zh.textContent = '显示单词';
    }
  }

  document.getElementById('btnWords').addEventListener('click', function() {
    if (mode === 'shuffled') {
      mode = 'fixed';
      wordsVisible = true;
      items.forEach(function(el) { el.classList.remove('revealed'); });
      placeAtSlots(defaultOrderIds);
      scene.classList.remove('mode-shuffled');
      scene.classList.remove('words-hidden');
    } else {
      wordsVisible = !wordsVisible;
      scene.classList.toggle('words-hidden', !wordsVisible);
    }
    setWordsButtonLabel();
    updateStatus();
  });

  document.getElementById('btnShuffle').addEventListener('click', function() {
    mode = 'shuffled';
    scene.classList.add('mode-shuffled');
    scene.classList.remove('words-hidden');
    items.forEach(function(el) { el.classList.remove('revealed'); });
    var newOrder = shuffleArray(defaultOrderIds);
    var current = items.slice().sort(function(a,b) { return a.getAttribute('data-slot') - b.getAttribute('data-slot'); }).map(function(el) { return el.getAttribute('data-id'); });
    var same = newOrder.every(function(id, i) { return id === current[i]; });
    if (same) { newOrder.reverse(); }
    placeAtSlots(newOrder);
    setWordsButtonLabel();
    updateStatus();
  });

  items.forEach(function(el) {
    function toggle() {
      if (mode !== 'shuffled') return;
      el.classList.toggle('revealed');
      updateStatus();
    }
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  setWordsButtonLabel();
})();
</script>
</body>
</html>
